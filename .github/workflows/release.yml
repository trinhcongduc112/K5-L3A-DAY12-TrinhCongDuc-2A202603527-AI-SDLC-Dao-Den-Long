name: Publish v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
    tags:
      - 'v1.0.0'

concurrency:
  group: publish-v1.0.0
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1.0.0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/package-release.py
      - name: Publish game and demo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 Dao-Den-Long-v1.0.0.zip docs/demo/demo.mp4 \
              --verify-tag --title "Đảo Đèn Lồng v1.0.0" --notes-file docs/release-v1.0.0.md
          fi
